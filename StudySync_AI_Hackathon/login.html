<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudySync AI - Login</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #eef4ff, #f8fbff);
    color: #172033;
}

.card {
    width: 420px;
    max-width: 92%;
    background: white;
    padding: 35px;
    border-radius: 22px;
    border: 1px solid #e5eaf2;
    box-shadow: 0 20px 50px rgba(31,55,90,0.15);
}

.logo {
    width: 62px;
    height: 62px;
    margin: 0 auto 18px;
    border-radius: 17px;
    background: linear-gradient(135deg,#4263eb,#7048e8);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 27px;
    font-weight: bold;
}

h1 {
    text-align: center;
    font-size: 25px;
    margin: 0 0 7px;
}

.subtitle {
    text-align: center;
    color: #718096;
    font-size: 14px;
    margin-bottom: 28px;
}

label {
    display: block;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 7px;
}

.input-group {
    margin-bottom: 18px;
}

input[type="email"],
input[type="password"] {
    width: 100%;
    padding: 13px;
    border: 1px solid #dce2eb;
    border-radius: 11px;
    outline: none;
    font-size: 14px;
}

input:focus {
    border-color: #4263eb;
    box-shadow: 0 0 0 3px rgba(66,99,235,.1);
}

.password-box {
    position: relative;
}

.password-box input {
    padding-right: 65px;
}

.show-btn {
    position: absolute;
    right: 8px;
    top: 8px;
    border: none;
    background: none;
    color: #4263eb;
    font-weight: bold;
    cursor: pointer;
    padding: 5px;
}

.options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 15px 0 22px;
    font-size: 12px;
}

.remember {
    display: flex;
    align-items: center;
    gap: 5px;
    color: #657184;
}

.remember input {
    width: auto;
}

.forgot {
    color: #4263eb;
    text-decoration: none;
}

.signin {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 11px;
    background: #4263eb;
    color: white;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
}

.signin:hover {
    background: #364fc7;
}

.divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 23px 0;
    color: #9aa4b2;
    font-size: 12px;
}

.divider::before,
.divider::after {
    content: "";
    height: 1px;
    background: #e6eaf0;
    flex: 1;
}

.google {
    width: 100%;
    padding: 13px;
    border-radius: 11px;
    background: white;
    border: 1px solid #dce2eb;
    color: #303846;
    font-weight: bold;
    cursor: pointer;
}

.google:hover {
    background: #f8f9fb;
}

.footer {
    text-align: center;
    margin-top: 20px;
    color: #9aa4b2;
    font-size: 11px;
}
</style>
</head>

<body>

<div class="card">

    <div class="logo">S</div>

    <h1>Welcome to StudySync AI</h1>

    <p class="subtitle">
        Sign in to continue your learning journey
    </p>

    <form id="loginForm">

        <div class="input-group">
            <label for="email">Email</label>

            <input
                id="email"
                type="email"
                placeholder="Enter your email"
                required
            >
        </div>

        <div class="input-group">

            <label for="password">Password</label>

            <div class="password-box">

                <input
                    id="password"
                    type="password"
                    placeholder="Enter your password"
                    required
                >

                <button
                    type="button"
                    class="show-btn"
                    onclick="togglePassword()"
                >
                    Show
                </button>

            </div>
        </div>

        <div class="options">

            <label class="remember">
                <input type="checkbox">
                Remember me
            </label>

            <a href="#" class="forgot">
                Forgot password?
            </a>

        </div>

        <button type="submit" class="signin">
            Sign In
        </button>

    </form>

    <div class="divider">
        OR
    </div>

    <button
        type="button"
        class="google"
        onclick="googleLogin()"
    >
        Continue with Google
    </button>

    <div class="footer">
        StudySync AI • Learning made smarter
    </div>

</div>

<script>

function togglePassword() {

    const password =
        document.getElementById("password");

    const button =
        document.querySelector(".show-btn");

    if (password.type === "password") {

        password.type = "text";
        button.textContent = "Hide";

    } else {

        password.type = "password";
        button.textContent = "Show";

    }
}


document
.getElementById("loginForm")
.addEventListener("submit", function(event) {

    event.preventDefault();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value.trim();

    if (email === "" || password === "") {

        alert("Please enter your email and password.");

        return;

    }

    /*
      Open your EXISTING StudySync application.
      index.html must be in the same folder.
    */

    window.location.href = "index.html";

});


function googleLogin() {

    alert("Google Sign-In is not connected yet.");

}

</script>

</body>
</html>
